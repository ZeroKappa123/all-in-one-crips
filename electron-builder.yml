appId: dev.zero.all-in-one-crips
productName: All-In-One CRIPS
directories: { output: dist, buildResources: resources }
files: ["out/**", "package.json", "resources/tray.png", "resources/THIRD_PARTY.md"]
extraResources: [{ from: resources/apt-data, to: apt-data }]
artifactName: "All-In-One-CRIPS-${version}-${os}.${ext}"
asarUnpack: ["node_modules/uiohook-napi/**"]
win: { target: nsis, icon: resources/icon.png, signAndEditExecutable: false }
nsis: { oneClick: false, allowToChangeInstallationDirectory: true }
linux: { target: AppImage, category: Game, icon: resources/icon.png }
publish: null
npmRebuild: false
